name: Linux Build Test
on:
  push:
    branches:
      - master
    paths:
      '.prerelease'
env:
  RELEASE_TITLE: "BlackHosts"
  RELEASE_FILE: "./docs/md/release.md"
  PRERELEASE_FILE: "./docs/md/pre-release.md"
  PRERELEASE: true

jobs:
  build_test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Toolchain Setup
        uses: actions-rs/toolchain@v1.0.7
        with:
          toolchain: stable
      - name: Pre-Setup
        run: |
          mkdir -p build/{windows,macos,linux,debian}
          find build -type d
      - name: Build
        uses: actions-rs/cargo@v1.0.3
        with:
          command: build
          args: --release --all-targets
      - name: Move Linux Build
        run: |
          build="./target/release/blackhosts"
          if [[ -x "$build" ]]; then
            mv "$build" build/linux/blackhosts_linux
          fi
          find build -type f

          
